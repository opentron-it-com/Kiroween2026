name: Build Desktop App Installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Backend JAR (H2 Embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          cd java/opentron-java/backend
          mvn clean package -DskipTests=true -q
          JAR=$(ls -t target/*-exec.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No exec JAR built"
            ls -la target/
            exit 1
          fi
          cp "$JAR" /tmp/backend.jar
        shell: bash

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: /tmp/backend.jar
          retention-days: 1

  build-desktop-windows:
    name: Build Desktop (Windows)
    needs: [build-jar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-download

      - name: Setup Sidecar
        run: |
          if exist frontend\src-tauri\sidecar\backend.jar del /f /q frontend\src-tauri\sidecar\backend.jar
          if exist frontend\src-tauri\sidecar\jre rmdir /s /q frontend\src-tauri\sidecar\jre
          if not exist frontend\src-tauri\sidecar mkdir frontend\src-tauri\sidecar
          copy /y backend-download\backend.jar frontend\src-tauri\sidecar\backend.jar
          "%JAVA_HOME%\bin\jlink.exe" --add-modules java.base,java.logging,java.net.http,java.management,java.naming,java.sql,java.transaction.xa,java.security.jgss,jdk.charsets,jdk.unsupported,java.xml,java.desktop,java.instrument,jdk.management,jdk.crypto.ec --strip-debug --no-header-files --no-man-pages --compress=2 --output frontend\src-tauri\sidecar\jre
          if not exist frontend\src-tauri\sidecar\backend.jar exit /b 1
          if not exist frontend\src-tauri\sidecar\jre\bin\java.exe exit /b 1
        shell: cmd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: NPM Install
        run: |
          cd frontend
          npm ci --no-audit --no-fund
        shell: cmd

      - name: TypeScript & Vite Build
        run: |
          cd frontend
          npx tsc -b
          npx vite build --outDir dist
        shell: cmd

      - name: Tauri Build (MSI & NSIS)
        run: |
          cd frontend
          npm run tauri build
        shell: cmd

      - name: Build MSIX Package
        shell: powershell
        run: |
          # 1. Prepare Staging Directory
          If (Test-Path msix_stage) { Remove-Item msix_stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path msix_stage | Out-Null
          New-Item -ItemType Directory -Force -Path msix_stage\icons | Out-Null
          New-Item -ItemType Directory -Force -Path msix_stage\sidecar | Out-Null
          New-Item -ItemType Directory -Force -Path msix_stage\resources\sidecar | Out-Null

          # 2. Copy the Tauri executable (Rename to match AppxManifest.xml target)
          $exe = "frontend\src-tauri\target\release\tron-desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Tauri executable missing: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination "msix_stage\app.exe"

          # 3. Copy Sidecar JRE & Backend into both runtime lookup locations
          Copy-Item -Path "frontend\src-tauri\sidecar\*" -Destination "msix_stage\sidecar" -Recurse -Force
          Copy-Item -Path "frontend\src-tauri\sidecar\*" -Destination "msix_stage\resources\sidecar" -Recurse -Force
          foreach ($sidecarDir in @("msix_stage\sidecar", "msix_stage\resources\sidecar")) {
            if (-not (Test-Path "$sidecarDir\backend.jar")) {
              throw "backend.jar missing from $sidecarDir"
            }
            if (-not (Test-Path "$sidecarDir\jre\bin\java.exe")) {
              throw "Bundled Java runtime missing from $sidecarDir"
            }
            if (-not (Test-Path "$sidecarDir\jre\bin\jli.dll")) {
              throw "Java launcher library missing from $sidecarDir"
            }
          }

          # 4. Copy Manifest
          If (-not (Test-Path "frontend\src-tauri\AppxManifest.xml")) {
              Write-Error "AppxManifest.xml missing in frontend\src-tauri\"
              exit 1
          }
          Copy-Item "frontend\src-tauri\AppxManifest.xml" -Destination "msix_stage\AppxManifest.xml"

          # 5. Copy Icon Assets
          Copy-Item -Path "frontend\src-tauri\icons\*" -Destination "msix_stage\icons\" -Recurse -Force

          # 6. Locate Windows SDK makeappx.exe & Pack MSIX
          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1 -ExpandProperty FullName
          & "$makeappx" pack /d msix_stage /p JVMAI.msix
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed with exit code $LASTEXITCODE" }

          # Verify the packaged MSIX retains the sidecar files
          If (Test-Path msix_verify) { Remove-Item msix_verify -Recurse -Force }
          & "$makeappx" unpack /p JVMAI.msix /d msix_verify
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack verification failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "msix_verify\app.exe")) {
            throw "Application executable missing from the packed MSIX"
          }
          if (-not (Test-Path "msix_verify\resources\sidecar\backend.jar")) {
            throw "backend.jar missing from the packed MSIX resources"
          }
          if (-not (Test-Path "msix_verify\resources\sidecar\jre\bin\java.exe")) {
            throw "Bundled Java runtime missing from the packed MSIX resources"
          }
          if (-not (Test-Path "msix_verify\resources\sidecar\jre\bin\jli.dll")) {
            throw "Java launcher library missing from the packed MSIX resources"
          }

      - name: Upload MSIX Package
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-msix
          path: JVMAI.msix
          retention-days: 1

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-msi
          path: frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 1

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build-desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-msi
          path: installers

      - name: Download NSIS
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-nsis
          path: installers

      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-msix
          path: installers

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: false
          tag_name: ${{ github.ref_name }}
          body: |
            # OpenTron ${{ github.ref_name }}

            Production-ready desktop application - zero external dependencies.

            **Included:**
            - Java 21 Runtime (minimal JRE)
            - Spring Boot 3.1 + H2 Database
            - React 19 + Tauri Frontend

            **Windows Installation:**
            Download .msi, .exe, or .msix and run. Data stored at ~/.opentron/opentron.h2
