name: Java Backend CI

on:
  push:
    paths:
      - 'java/opentron-java/**'
      - 'deploy/models/**'
      - 'deploy/gcp/confidential-space/**'
      - 'startup_script.sh'
      - '.github/workflows/java-backend.yml'
  pull_request:
    paths:
      - 'java/opentron-java/**'
      - 'deploy/models/**'
      - 'deploy/gcp/confidential-space/**'
      - 'startup_script.sh'
      - '.github/workflows/java-backend.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run backend tests
        run: mvn -f java/opentron-java/pom.xml -pl backend,gateway-client -am test

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install worker starter
        run: mvn -f java/opentron-java/cjae-spring-boot-starter/pom.xml install
      - name: Run confidential worker tests
        run: mvn -f java/opentron-java/confidential-worker/pom.xml test

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build confidential worker image
        run: docker build -f java/opentron-java/backend/Dockerfile.confidential -t cjae-worker:ci .
      - name: Verify Confidential Space bootstrap requires signed configuration
        run: |
          set +e
          output="$(docker run --rm \
            -e SPRING_PROFILES_ACTIVE=gcp-cvm,gateway-oidc \
            -e CONFIDENTIAL_GATEWAY_ENABLED=true \
            cjae-worker:ci 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s' "$output" | grep -q "signed Confidential Space runtime configuration is invalid"

  deployment-script-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n deploy/gcp/confidential-space/launch.sh startup_script.sh
          python3 -c "from pathlib import Path; files=['java/opentron-java/confidential-worker/src/main/docker/confidential_space_entrypoint.py','java/opentron-java/confidential-worker/src/main/docker/cjae_runtime_config.py']; [compile(Path(f).read_text(), f, 'exec') for f in files]"
          PYTHONPATH=java/opentron-java/confidential-worker/src/main/docker python3 -m unittest discover -s java/opentron-java/confidential-worker/src/test/python
