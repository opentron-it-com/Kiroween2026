# Set these in the GCP deployment environment or a managed config store.
# The worker uses the checksum-pinned gotpm utility and mounted vTPM event log.
confidential.gateway.enabled=${CONFIDENTIAL_GATEWAY_ENABLED:false}
confidential.gcp.attestation.audience=${GCP_GCA_AUDIENCE}
confidential.gcp.attestation.hardware-model=${GCP_CVM_HARDWARE_MODEL}
confidential.gcp.attestation.allowed-projects=${GCP_CVM_ALLOWED_PROJECTS}
confidential.gcp.attestation.allowed-zones=${GCP_CVM_ALLOWED_ZONES}
confidential.gcp.attestation.allowed-instances=${GCP_CVM_ALLOWED_INSTANCES}
confidential.gcp.attestation.expected-image-digest=${GCP_CONFIDENTIAL_SPACE_IMAGE_DIGEST:}
confidential.gcp.attestation.gotpm-path=${GCP_GOTPM_PATH:/opt/cjae/bin/gotpm}
confidential.gcp.attestation.event-log-path=${GCP_TPM_EVENT_LOG_PATH:/opt/cjae/tpm/event.log}
confidential.gcp.wif.audience=${GCP_WIF_PROVIDER_AUDIENCE}
confidential.gcp.kms.key-resource=${GCP_KMS_KEY_RESOURCE}
confidential.gcp.kms.context-key-id=${GCP_CONTEXT_KEY_ID}
confidential.gcp.kms.ciphertext-base64=${GCP_CONTEXT_DEK_CIPHERTEXT_BASE64}
