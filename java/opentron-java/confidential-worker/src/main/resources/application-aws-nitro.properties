# Enclave-only configuration. NSM attestation uses Panama FFM directly
# against /dev/nsm; the KMS proxy remains a parent vsock service.
# KMS ciphertext is encrypted key material, not plaintext.
confidential.aws.nitro.kms.key-id=${AWS_NITRO_KMS_KEY_ID}
confidential.aws.nitro.kms.ciphertext-blob-base64=${AWS_NITRO_CONTEXT_DEK_CIPHERTEXT_BASE64}
confidential.aws.nitro.kms.context-key-id=${AWS_NITRO_CONTEXT_KEY_ID}
confidential.aws.nitro.verify-on-startup=${AWS_NITRO_VERIFY_ON_STARTUP:false}
confidential.aws.nitro.diagnostics.enabled=${AWS_NITRO_DIAGNOSTICS_ENABLED:false}
confidential.aws.nitro.vsock.parent-cid=${AWS_NITRO_PARENT_VSOCK_CID:3}
confidential.aws.nitro.vsock.proxy-port=${AWS_NITRO_KMS_PROXY_VSOCK_PORT:8000}
confidential.aws.nitro.health-vsock.enabled=${AWS_NITRO_HEALTH_VSOCK_ENABLED:false}
confidential.aws.nitro.health-vsock.port=${AWS_NITRO_HEALTH_VSOCK_PORT:8002}
confidential.aws.nitro.benchmark.enabled=${AWS_NITRO_CONFIDENTIAL_BENCHMARK_ENABLED:false}
confidential.aws.nitro.benchmark.samples=${AWS_NITRO_CONFIDENTIAL_BENCHMARK_SAMPLES:100}
confidential.aws.nitro.benchmark.warmup=${AWS_NITRO_CONFIDENTIAL_BENCHMARK_WARMUP:10}
confidential.aws.nitro.rag-benchmark.enabled=${AWS_NITRO_RAG_BENCHMARK_ENABLED:false}
confidential.aws.nitro.rag-benchmark.python-executable=${AWS_NITRO_RAG_PYTHON_EXECUTABLE:python3}
confidential.aws.nitro.rag-benchmark.python-script=${AWS_NITRO_RAG_PYTHON_SCRIPT:/opt/cjae/bin/python_serialized_proxy.py}
confidential.gateway.enabled=${CONFIDENTIAL_GATEWAY_ENABLED:false}
confidential.aws.nitro.tls.keystore-ciphertext-base64=${AWS_NITRO_TLS_KEYSTORE_CIPHERTEXT_BASE64:}
confidential.aws.nitro.gateway.vsock-port=${AWS_NITRO_GATEWAY_VSOCK_PORT:8001}
confidential.aws.nitro.gateway.tls-port=${AWS_NITRO_GATEWAY_TLS_PORT:8443}
